  --g-water: #BFDDF2; --g-water-2: #4A8CC9; --g-land: #DCEAC8; --g-land-2: #A6C882; --g-sand: #EFDCAA; --g-rock: #CDBB9F; --g-rock-2: #8C7A62; --g-soil: #9A6B45;
  --g-mantle: #EE9A5B; --g-core: #F2C94C; --g-magma: #D9480F; --g-hot: #D9480F; --g-cold: #1C7ED6; --g-veg: #4F8A34; --g-snow: #F5F8FB; --g-sky: #E4F0FB; --g-cloud: #FFFFFF;
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --top: 56px; --side: 292px;
  --shadow: 0 1px 2px rgba(20, 27, 43, 0.05), 0 10px 30px -18px rgba(20, 27, 43, 0.35);
}

    --bg: #0E131B; --paper: #151C27; --sunken: #1B2331; --ink: #E7EBF2; --ink-2: #AEB8C8; --ink-3: #8390A4;

    --g-water: #1C3A56; --g-water-2: #4F8FD0; --g-land: #2B3D28; --g-land-2: #4D6A3A; --g-sand: #5A4C2E; --g-rock: #4E4538; --g-rock-2: #8E7C63; --g-soil: #7A5236;
    --g-mantle: #A5542A; --g-core: #B8942E; --g-magma: #FF7043; --g-hot: #FF7A45; --g-cold: #5AA9F0; --g-veg: #6DB24A; --g-snow: #C8D3E0; --g-sky: #17263A; --g-cloud: #2A3446;

  }
}

  --bg: #0E131B; --paper: #151C27; --sunken: #1B2331; --ink: #E7EBF2; --ink-2: #AEB8C8; --ink-3: #8390A4;
  --rule: #2A3446; --rule-soft: #212A39; --grid: rgba(143, 166, 255, 0.05);
  --accent: #8EA4FF; --accent-2: #B4C2FF; --accent-soft: #1E2847; --on-accent: #0E131B;
  --good: #5FCB8F; --good-soft: #15281E; --bad: #FF8E82; --bad-soft: #33191A; --warn: #F2B35C; --warn-soft: #2E2413;
  --lv1: #FB8B52; --lv2: #34CDB8; --lv3: #C4A5FF; --lv4: #FF8A80; --lv5: #8EB4FF; --lv6: #F2C14E; --lv7: #F58BB0; --lv8: #A3D96B; --lv9: #5CC8F0; --lv10: #A5B4FC;
    --g-water: #1C3A56; --g-water-2: #4F8FD0; --g-land: #2B3D28; --g-land-2: #4D6A3A; --g-sand: #5A4C2E; --g-rock: #4E4538; --g-rock-2: #8E7C63; --g-soil: #7A5236;
    --g-mantle: #A5542A; --g-core: #B8942E; --g-magma: #FF7043; --g-hot: #FF7A45; --g-cold: #5AA9F0; --g-veg: #6DB24A; --g-snow: #C8D3E0; --g-sky: #17263A; --g-cloud: #2A3446;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 30px -18px rgba(0, 0, 0, 0.7);
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16.5px/1.6 var(--f-body); }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; color: var(--ink); }
code { font: 0.88em var(--f-mono); background: var(--sunken); padding: 0.1em 0.35em; border-radius: 4px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.print-only { display: none; }
svg { flex: none; }
.btn svg, .key-toggle svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
mjx-container { font-size: 104% !important; }
mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; max-width: 100%; padding-block: 2px; }
mjx-container.mjx-wide { display: block; overflow-x: auto; overflow-y: hidden; max-width: 100%; padding-block: 2px; margin: 0.35em 0; }   /* a long inline formula on its own scrolling line */
.fbm { font-family: 'Cambria Math', 'Times New Roman', serif; font-style: italic; white-space: nowrap; }
.fbm-d { display: block; text-align: center; margin: 0.6em 0; white-space: normal; }

/* ---------- top bar & shell ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30; height: calc(var(--top) + env(safe-area-inset-top, 0px));
  padding: env(safe-area-inset-top, 0px) 16px 0; display: flex; align-items: center; gap: 12px;
  background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font: 800 1.2rem var(--f-display); letter-spacing: -0.01em; }
.brand svg { width: 28px; height: 28px; }
.brand small { font: 500 0.72rem var(--f-mono); color: var(--ink-3); letter-spacing: 0.04em; margin-inline-start: 4px; }
.menu-btn { display: none; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); border-radius: 8px; width: 40px; height: 40px; align-items: center; justify-content: center; cursor: pointer; }
.menu-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); align-items: start; }
.sidebar {
  position: sticky; top: calc(var(--top) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--top) - env(safe-area-inset-top, 0px));
  overflow-y: auto; border-inline-end: 1px solid var(--rule); padding: 16px 12px 48px; background: var(--bg); scrollbar-width: thin;
}
.search { position: relative; margin-bottom: 14px; }
.search input { width: 100%; font: 15px var(--f-body); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 9px 12px; }
.search input::placeholder { color: var(--ink-3); }
.nav-level + .nav-level { margin-top: 18px; }
.nav-level-title { display: flex; align-items: center; gap: 10px; font: 700 0.95rem var(--f-display); padding: 4px 6px 6px; }
.nav-level-title small { display: block; font: 500 0.7rem var(--f-mono); color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; }
.rung { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; background: var(--lv); color: var(--paper); font: 700 0.75rem var(--f-mono); flex: none; }
.rung-lg { width: 36px; height: 36px; font-size: 1rem; border-radius: 8px; }
.nav-topics { list-style: none; margin: 0; padding: 0; }
.nav-topics a { display: flex; gap: 10px; align-items: baseline; padding: 5px 8px; border-radius: 6px; color: var(--ink-2); text-decoration: none; font-size: 0.92rem; line-height: 1.35; }
.nav-topics a:hover { background: var(--sunken); color: var(--ink); }
.nav-topics a[aria-current="page"] { background: var(--paper); color: var(--ink); box-shadow: inset 3px 0 0 var(--lv), var(--shadow); font-weight: 700; }
.nav-topics .num { font: 500 0.72rem var(--f-mono); color: var(--ink-3); min-width: 1.4rem; }
.nav-review { font-style: italic; }
.main { padding: 32px clamp(16px, 4vw, 56px) 96px; min-width: 0; }
.scrim { display: none; }

/* ---------- buttons & controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; font: 700 0.92rem var(--f-body); padding: 9px 16px; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); text-decoration: none; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
.btn:hover { border-color: var(--ink-3); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn-ghost { background: transparent; }
.btn-small { padding: 6px 12px; font-size: 0.85rem; }
.eyebrow { display: flex; align-items: center; gap: 10px; font: 500 0.76rem var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--lv, var(--accent)); margin: 0 0 12px; }
.lede { color: var(--ink-2); font-size: 1.08rem; max-width: 62ch; margin: 12px 0 0; }

/* ---------- home ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: clamp(24px, 4vw, 56px); align-items: center; max-width: 1180px; margin: 0 auto 48px; }
.hero h1 { font-size: clamp(2.1rem, 1.3rem + 3vw, 3.5rem); font-weight: 800; letter-spacing: -0.025em; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
.sample { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 20px 22px; box-shadow: var(--shadow); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 22px 22px; min-height: 200px; }
.sample-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.sample-label { font: 500 0.72rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); }
.sample-topic { font: 600 0.78rem var(--f-mono); color: var(--lv); text-decoration: none; }
.sample-q { font-size: 1.05rem; }
.sample-choices { list-style: none; padding: 0; margin: 14px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 8px; }
.sample-choices li { display: flex; align-items: center; gap: 10px; }
.sample-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.sample-ans { margin-top: 12px; border-top: 1px dashed var(--rule); }
.sample-answer { margin: 12px 0 4px; } .sample-sol { margin: 0; color: var(--ink-2); font-size: 0.95rem; }
.reveal.collapsed { height: 0; overflow: hidden; visibility: hidden; margin: 0; padding: 0; border: 0; }
.ladder { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 16px; }
.level { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; }
.level-head { display: flex; gap: 12px; align-items: center; }
.level-head h2 { font-size: 1.25rem; }
.band { margin: 2px 0 0; font: 500 0.74rem var(--f-mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.05em; }
.level-blurb { color: var(--ink-2); font-size: 0.93rem; margin: 12px 0; }
.level-topics { margin: 0 0 14px; padding-inline-start: 1.4em; padding-inline-end: 0; font-size: 0.93rem; flex: 1; }
.level-topics li { padding: 2px 0; } .level-topics li::marker { color: var(--ink-3); font: 0.8em var(--f-mono); }
.level-topics a { color: var(--ink); text-decoration: none; } .level-topics a:hover { color: var(--lv); text-decoration: underline; }
.level-review { font-weight: 700; color: var(--lv); text-decoration: none; font-size: 0.92rem; }

/* ---------- topic ---------- */
.topic { max-width: 880px; margin: 0 auto; }
.crumbs { display: flex; gap: 8px; font: 0.8rem var(--f-mono); color: var(--ink-3); margin-bottom: 18px; }
.crumbs a { color: var(--ink-3); }
.topic-head h1 { font-size: clamp(2rem, 1.4rem + 2.2vw, 3rem); font-weight: 800; letter-spacing: -0.02em; }
.topic-tabs { display: flex; gap: 4px; margin-top: 26px; border-bottom: 1px solid var(--rule); }
.topic-tabs a { padding: 10px 18px; font: 700 0.98rem var(--f-display); color: var(--ink-3); text-decoration: none; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.topic-tabs a:hover { color: var(--ink); }
.topic-tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--lv); }
#panel { margin-top: 28px; }

/* ---------- lesson prose ---------- */
.lesson-tools { display: flex; justify-content: flex-end; margin: -12px 0 8px; }
.prose { max-width: 70ch; }
.rungs { max-width: 70ch; margin: 0 0 28px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); }
.rungs summary { display: flex; align-items: center; gap: 8px; padding: 10px 14px; cursor: pointer; list-style: none; font: 600 0.78rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
.rungs summary::-webkit-details-marker { display: none; }
.rungs summary .chev { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; transform: rotate(-90deg); transition: transform 0.2s; }
[dir="rtl"] .rungs summary .chev { transform: rotate(90deg); }
.rungs[open] summary .chev { transform: none; }
.rungs summary:hover { color: var(--ink); }
.rungs-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 24px; padding: 4px 16px 16px; }
.rungs-col ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.rungs-col li a { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--ink); text-decoration: none; }
.rungs-col li a:hover span:last-child { color: var(--lv); text-decoration: underline; }
.rungs-col li p { margin: 3px 0 0; font-size: 0.9rem; line-height: 1.5; color: var(--ink-2); }
.rungs-empty { margin: 0; font-size: 0.9rem; color: var(--ink-3); }
@media (max-width: 640px) { .rungs-cols { grid-template-columns: minmax(0, 1fr); } }
.prose > p, .prose li { color: var(--ink); }
.prose h3 { font-size: 1.3rem; margin: 2em 0 0.5em; }
.prose h3:first-child { margin-top: 0; }
.prose ul, .prose ol { padding-inline-start: 1.3em; padding-inline-end: 0; }
.prose li + li { margin-top: 4px; }
.box { margin: 1.4em 0; padding: 14px 18px; border-radius: 8px; }
.box > :last-child { margin-bottom: 0; } .box > p:first-of-type { margin-top: 0; }
.box-label { font: 600 0.72rem var(--f-mono) !important; text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 6px !important; }
.box-key { background: var(--accent-soft); } .box-key .box-label { color: var(--accent); }
.box-ex { border: 1.5px dashed var(--rule); background: var(--paper); } .box-ex .box-label { color: var(--ink-3); }
.box-tip { background: var(--warn-soft); } .box-tip .box-label { color: var(--warn); }
.formula { margin: 1em 0; padding: 4px 8px; overflow-x: auto; }
.tbl-wrap { overflow-x: auto; margin: 1em 0; }
.tbl { border-collapse: collapse; font-size: 0.93rem; min-width: 100%; background: var(--paper); font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { border: 1px solid var(--rule); padding: 7px 10px; text-align: start; vertical-align: middle; }
.tbl thead th, .tbl-q th { background: var(--sunken); font-weight: 700; }
.tbl-q { min-width: 0; width: auto; } .tbl-q td, .tbl-q th { text-align: center; }
.fig { margin: 1.4em 0; } .fig > svg { width: 100%; max-width: 520px; height: auto; display: block; }   /* direct child only: MathJax output in a caption is SVG too */
.fig figcaption { font-size: 0.85rem; color: var(--ink-3); margin-top: 6px; }
.fig-shape { fill: var(--accent-soft); stroke: var(--ink-2); stroke-width: 1.5; }
.fig-alpha { fill-opacity: 0.55; }
.fig-line { fill: none; stroke: var(--ink-2); stroke-width: 1.5; }
.fig-dash { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 4; }
.fig-frame { fill: none; stroke: var(--rule); stroke-width: 1.5; }
.fig-sector { fill: var(--accent-soft); stroke: none; }
.fig-dot { fill: var(--ink); }
.fig-text { fill: var(--ink); font: italic 600 15px var(--f-body); }
.fig-small { fill: var(--ink-2); font: 12px var(--f-body); }
.lesson-foot { margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--rule); display: grid; gap: 20px; }
.lesson-foot > .btn { justify-self: start; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pager a { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink); text-decoration: none; font-weight: 700; }
.pager a:hover { border-color: var(--ink-3); }
.pager small { font: 500 0.72rem var(--f-mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; }
.pager-next { text-align: end; }

/* ---------- worksheet ---------- */
.ws-controls { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-end; margin-bottom: 18px; }
.ctrl { display: flex; flex-direction: column; gap: 6px; }
.ctrl-label { font: 600 0.72rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--paper); }
.seg-btn { font: 600 0.9rem var(--f-mono); border: 0; background: transparent; color: var(--ink-2); padding: 8px 13px; cursor: pointer; }
.seg-btn + .seg-btn { border-left: 1px solid var(--rule); }
.seg-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
select { font: 15px var(--f-body); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; }
.ctrl-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-inline-start: auto; }
.sheet {
  background-color: var(--paper); border: 1px solid var(--rule); border-radius: 6px; box-shadow: var(--shadow);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; padding: clamp(18px, 3.5vw, 40px);
}
.sheet-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; padding-bottom: 16px; border-bottom: 2px solid var(--ink); }
.kicker { font: 600 0.72rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--lv, var(--ink-3)); margin: 0 0 4px; }

/* ---------- i18n ----------
   Every piece of English prose is written as T`...` (a raw template, like String.raw).
   Its static text, with ⟦0⟧, ⟦1⟧… standing for the ${} slots, is hashed to a key.

/* Whittaker's biome chart: mean annual temperature against annual rainfall */
function whittakerSvg({ label, names = {}, mark } = {}) {
  const W = 480, H = 320, L = 56, R = 16, Tp = 18, B = 44, X = t => L + (t + 15) / 45 * (W - L - R), Y = p => Tp + (1 - p / 4500) * (H - Tp - B);
  let s = svgOpen(W, H, label);
  const B6 = [
    ['tundra', 'g-s6', [[-15, 0], [-5, 0], [-5, 600], [-15, 300]], [-10, 200]],
    ['taiga', 'g-s3', [[-5, 0], [3, 250], [5, 1200], [-5, 600]], [-1, 450]],
    ['temperate', 'g-s4', [[3, 250], [20, 700], [20, 3000], [12, 2500], [5, 1200]], [12, 1300]],
    ['grass', 'g-s5', [[3, 250], [3, 0], [30, 500], [30, 1300], [20, 700]], [18, 470]],
    ['desert', 'g-s2', [[3, 0], [30, 0], [30, 500]], [22, 160]],
    ['savanna', 'g-s2', [[20, 700], [30, 1300], [30, 2500], [20, 1300]], [25, 1500]],
    ['rain', 'g-s1', [[20, 1300], [30, 2500], [30, 4500], [20, 3000]], [25, 3500]],
  ];
  const lab = { tundra: names.tundra || 'Tundra', taiga: names.taiga || 'Taiga', temperate: names.temperate || 'Temperate forest', grass: names.grass || 'Grassland', desert: names.desert || 'Desert', savanna: names.savanna || 'Savanna', rain: names.rain || 'Rainforest' };
  B6.forEach(([k, c, pts]) => { s += polyg(pts.map(([t, p]) => [X(t), Y(p)]), c, ' fill-opacity="0.55" stroke="var(--paper)" stroke-width="2"'); });
  B6.forEach(([k, c, pts, [t, p]]) => { s += lbl(X(t), Y(p) + 4, lab[k]); });
  for (let t = -10; t <= 30; t += 10) s += ln(X(t), H - B, X(t), H - B + 4, 'fig-line') + txt(X(t), H - B + 17, F(t), 'fig-small');
  for (let p = 0; p <= 4000; p += 1000) s += ln(L - 4, Y(p), L, Y(p), 'fig-line') + txt(L - 7, Y(p) + 4, F(p), 'fig-small', 'end');
  s += ln(L, Tp, L, H - B, 'fig-line') + ln(L, H - B, W - R, H - B, 'fig-line') + txt((L + W - R) / 2, H - 8, names.xl || 'mean annual temperature (°C)', 'fig-small') + txt(L - 4, Tp - 6, names.yl || 'rain (mm/year)', 'fig-small', 'start');
  if (mark) s += circ(X(mark[0]), Y(mark[1]), 6, 'g-hot', ' stroke="var(--paper)" stroke-width="2"') + lbl(X(mark[0]), Y(mark[1]) + 24, mark[2] || '?');
  return s + '</svg>';
}

/* an energy pyramid: each level keeps about 10% of the energy of the level below */
function energyPyramidSvg(levels, { label, values, unit = '' } = {}) {
  const W = 480, n = levels.length, rowH = 44, H = n * rowH + 20, cx = 200;
  let s = svgOpen(W, H, label);
  levels.forEach((t, i) => {
    const y = H - 10 - (i + 1) * rowH, w = 360 * (1 - i / (n + 0.3)), cls = ['g-s3', 'g-s4', 'g-s2', 'g-s5', 'g-s6'][i % 5];
    s += polyg([[cx - w / 2, y + rowH], [cx + w / 2, y + rowH], [cx + w / 2 - 360 / (n + 0.3) / 2, y + 2], [cx - w / 2 + 360 / (n + 0.3) / 2, y + 2]], cls, ' fill-opacity="0.75" stroke="var(--paper)" stroke-width="2"') + lbl(cx, y + rowH / 2 + 6, t);
    if (values) s += note(cx + w / 2 + 14, y + rowH / 2 + 5, values[i] + unit, 'start');
  });
  return s + '</svg>';
}

<h3>Scale</h3>
<p>A <b>numerical scale</b> such as $1 : 50\,000$ means 1 unit on the map equals 50 000 of the same units on the ground. A <b>verbal scale</b> says it in words ("1 cm represents 500 m"), and a <b>graphic scale</b> is a bar, which stays correct when the map is enlarged or reduced.</p>

<p>A <b>large-scale</b> map (e.g. $1 : 5\,000$) shows a small area in great detail; a <b>small-scale</b> map (e.g. $1 : 1\,000\,000$) shows a large area with little detail. The bigger the denominator, the smaller the scale.</p>

<p>The equator and the meridians are <b>great circles</b>: circles whose centre is the centre of the Earth. The shortest route between two places follows a great circle, which is why long flights look curved on a flat map.</p>

<p>The Earth turns $360^\circ$ in 24 hours, so the Sun appears to move $15^\circ$ of longitude every hour, or $1^\circ$ every 4 minutes. Places further east see the Sun rise earlier, so their clocks are ahead.</p>
${Fm(T`\Delta t = \frac{\Delta\lambda}{15^\circ}\ \text{hours} = \Delta\lambda \times 4\ \text{minutes}`)}
<p><b>Local mean time</b> is set by the Sun at that exact meridian. To avoid every town having its own time, the world uses <b>standard time zones</b>, each about $15^\circ$ wide and a whole number of hours from <b>UTC</b> (Coordinated Universal Time, the time at Greenwich).</p>
${FigW(timeStripSvg({ places: [[106.8, 'Jakarta'], [-0.1, 'London'], [139.7, 'Tokyo'], [-74, 'New York']], refLon: 106.8, refHour: 14, label: T`A strip of the world's time zones showing the time in four cities when it is 14:00 in Jakarta` }), T`When it is 14:00 in Jakarta (UTC+7), it is 07:00 in London, 16:00 in Tokyo and 02:00 in New York.`)}
<h3>Indonesia's time zones</h3>
${FigW(indonesiaSvg({ zones: [[104, 'WIB · UTC+7'], [121, 'WITA · UTC+8'], [135, 'WIT · UTC+9']], marks: [[106.8, -6.2, 'Jakarta'], [119.4, -5.1, 'Makassar'], [140.7, -2.5, 'Jayapura', 'end']], label: T`Map of Indonesia divided into three time zones` }), T`Indonesia spans about 46° of longitude, so it uses three time zones.`)}
${Tbl([T`Zone`, T`Offset`, T`Regions`], [[T`WIB (Western Indonesia Time)`, T`UTC+7`, T`Sumatra, Java, West and Central Kalimantan`], [T`WITA (Central Indonesia Time)`, T`UTC+8`, T`Bali, Nusa Tenggara, South, East and North Kalimantan, Sulawesi`], [T`WIT (Eastern Indonesia Time)`, T`UTC+9`, T`Maluku and Papua`]])}
${Key(T`<p>The <b>International Date Line</b> runs roughly along $180^\circ$. Crossing it westwards (from America towards Asia) you move the date forward one day; crossing it eastwards you go back one day.</p>`)}
${Tip(T`<p>To convert between zones, first convert to UTC, then to the other zone. 09:00 WIB is 02:00 UTC, which is 10:00 WITA and 11:00 WIT.</p>`)}`,

    },
    () => {
      const hm = x => { const h = ((Math.floor(x) % 24) + 24) % 24, mm = Math.round((x - Math.floor(x)) * 60); return `${String(h).padStart(2, '0')}:${String(mm).padStart(2, '0')}`; };
      const [A, oa] = pick([['Jakarta', 7], ['Makassar', 8], ['Jayapura', 9], ['Medan', 7], ['Denpasar', 8], ['Ambon', 9]]), [B, ob] = pick([['London', 0], ['Tokyo', 9], ['Dubai', 4], ['New York', -5], ['Sydney', 10], ['Paris', 1], ['Beijing', 8]]);
      const t = ri(0, 23) + pick([0, 0.5]), tb = t + ob - oa;

        w: [hm(t - ob + oa), hm(tb + 1), hm(t + ob)].filter(x => x !== hm(tb)), only: 'mc',
        s: T`The difference is $${ob} - (${oa}) = ${ob - oa}$ hours, so the time in ${B} is ${hm(t)} ${ob - oa >= 0 ? '+' : '−'} ${Math.abs(ob - oa)} h = <b>${hm(tb)}</b>${tb >= 24 ? T` the next day` : tb < 0 ? T` the previous day` : ''}.` };
    },
    () => {

      const [[A, oa], [B, ob]] = pick([[['Jakarta', 7], ['Jayapura', 9]], [['Jayapura', 9], ['Jakarta', 7]], [['Denpasar', 8], ['Jakarta', 7]], [['Medan', 7], ['Makassar', 8]], [['Ambon', 9], ['Surabaya', 7]], [['Balikpapan', 8], ['Jayapura', 9]]]);

        s: T`WIB (UTC+7): Sumatra, Java, West and Central Kalimantan. WITA (UTC+8): Bali, Nusa Tenggara, the rest of Kalimantan and Sulawesi. WIT (UTC+9): Maluku and Papua. ${city} uses <b>${zone}</b>.` };
    },
    () => {

      return { q: T`A place lies at ${lo}° ${e ? dir('E') : dir('W')}. If its time zone follows its central meridian exactly, what is its offset from UTC, in hours? (Use a minus sign for places behind UTC.)`, a: e ? off : -off, neg: true, u: 'h', rtol: 0, w: [e ? -off : off, lo / 4, lo / 60],
        s: T`$${lo}^\circ \div 15^\circ = ${off}$ hours, ${e ? T`ahead of UTC because it is east of Greenwich` : T`behind UTC because it is west of Greenwich`}: UTC${e ? '+' : '−'}${off}.` };
    },
    () => pick([
      { q: T`A ship crosses the International Date Line sailing <b>westwards</b>, from Hawaii towards Japan, on Monday. What happens to the date?`, a: T`It becomes Tuesday: one day is skipped`, w: [T`It becomes Sunday: one day is repeated`, T`Nothing changes`, T`The clock goes back 12 hours`], only: 'mc', s: T`Travelling west across the Date Line you jump forward one day, because places just west of it are almost a full day ahead of places just east of it.` },
      { q: T`Why do places further east see the Sun rise earlier?`, a: T`The Earth rotates from west to east`, w: [T`The Earth rotates from east to west`, T`The Sun moves around the Earth from east to west`, T`Places in the east are closer to the Sun`], only: 'mc', s: T`The Earth spins towards the east, so eastern places turn into the sunlight first.` },
      { q: T`Why does Indonesia have three time zones?`, a: T`It stretches across about 46° of longitude`, w: [T`It lies on the equator`, T`It stretches across many degrees of latitude`, T`It has many islands`], only: 'mc', s: T`From about 95° E to 141° E is some 46°, roughly three hours of solar time, so one zone would be far from the Sun's time at each end.` },

  ],

{
  id: 'projections', stage: 'sh', title: 'Map Projections',
  blurb: 'Why a round Earth cannot be flattened without distortion, cylindrical, conic and azimuthal projections, and what each one keeps true.',
  lesson: () => T`
<p>A globe is the only map that shows shape, area, distance and direction correctly all at once. Flattening the curved surface onto paper always stretches or squeezes something. A <b>map projection</b> is the rule used to transfer the grid of parallels and meridians onto a flat surface.</p>
<h3>Three developable surfaces</h3>
${Fig(projectionSvg('cylindrical', { label: T`A cylinder wrapped around the globe touching the equator, and the resulting rectangular grid` }), T`<b>Cylindrical</b>: the cylinder touches the equator. Meridians become parallel straight lines; the areas near the poles are stretched. Best for the tropics and for world maps.`)}
${Fig(projectionSvg('conic', { label: T`A cone placed over the globe touching one parallel, and the resulting fan-shaped grid` }), T`<b>Conic</b>: the cone touches one parallel (the standard parallel). Parallels become arcs and meridians straight lines meeting at a point. Best for the middle latitudes.`)}
${Fig(projectionSvg('azimuthal', { label: T`A flat plane touching the globe at the pole, and the resulting circular grid` }), T`<b>Azimuthal (zenithal)</b>: a flat plane touches one point, often a pole. Parallels become circles and meridians radiate out. Best for polar regions.`)}
${Tbl([T`Property kept`, T`Name`, T`Used for`], [[T`Shape of small areas (angles)`, T`conformal (orthomorphic)`, T`navigation charts, e.g. Mercator`], [T`Area`, T`equivalent (equal-area)`, T`distribution maps such as population or forests`], [T`Distance from one point`, T`equidistant`, T`air routes from one airport`]])}
${Key(T`<p>The <b>Mercator</b> projection is cylindrical and conformal: a straight line on it is a constant compass bearing, which is why sailors used it. The price is size: at latitude $\varphi$ lengths are stretched by $\dfrac{1}{\cos\varphi}$ and areas by $\dfrac{1}{\cos^2\varphi}$. Greenland (around $72^\circ$ N) looks as big as Africa though Africa is about 14 times larger.</p>`)}
${Tip(T`<p>No projection is "the best": choose the one whose kept property matters for the map's purpose, and whose shape suits the area being mapped.</p>`)}`,
  gens: [
    () => {
      const la = pick([30, 40, 45, 50, 60, 70, 75]), k = 1 / cosD(la), area = chance();
      return { q: T`On a Mercator map, by what factor are ${area ? T`areas` : T`lengths`} exaggerated at latitude ${la}°?`, a: sig(area ? k * k : k), rtol: 0.02, w: area ? [sig(k), sig(cosD(la) ** 2, 3), sig(k * k * 2)] : [sig(k * k), sig(cosD(la), 3), sig(1 / sinD(la))],
        s: area ? T`Areas are stretched by $\frac{1}{\cos^2\varphi} = \frac{1}{\cos^2 ${la}^\circ} = ${M(sig(k * k))}$.` : T`Lengths are stretched by $\frac{1}{\cos\varphi} = \frac{1}{\cos ${la}^\circ} = ${M(sig(k))}$.` };
    },
    () => pick([
      { q: T`Which projection is most suitable for a map of Antarctica?`, a: T`Azimuthal`, w: [T`Cylindrical`, T`Conic`, T`Mercator`], only: 'mc', s: T`An azimuthal plane touching the pole shows the polar region with the least distortion.` },
      { q: T`Which projection is most suitable for a map of Indonesia, which lies on the equator?`, a: T`Cylindrical`, w: [T`Azimuthal (polar)`, T`Conic`, T`None; the equator cannot be mapped`], only: 'mc', s: T`A cylinder touching the equator has the least distortion near the equator.` },
      { q: T`Which projection is most suitable for a map of Europe or the United States (middle latitudes)?`, a: T`Conic`, w: [T`Cylindrical`, T`Azimuthal (polar)`, T`Mercator`], only: 'mc', s: T`A cone touching a mid-latitude parallel fits a wide east–west band in the middle latitudes well.` },
    ]),
    () => pick([
      { q: T`A map will show the population of each country with dots. Which property should its projection keep?`, a: T`Area (equal-area)`, w: [T`Shape (conformal)`, T`Distance (equidistant)`, T`Direction only`], only: 'mc', s: T`Density and distribution maps must not make some areas look bigger than others, so an equal-area projection is used.` },
      { q: T`Why did sailors use the Mercator projection?`, a: T`A straight line on it is a constant compass bearing`, w: [T`It shows areas correctly`, T`It shows the poles without distortion`, T`It shows true distances everywhere`], only: 'mc', s: T`Mercator is conformal: angles are true, so a course set with a compass is a straight line on the chart.` },
      { q: T`On a Mercator world map, why does Greenland look about as big as Africa?`, a: T`Areas are stretched more and more towards the poles`, w: [T`Greenland really is that big`, T`Africa is squeezed near the equator`, T`The map is drawn at two different scales on purpose`], only: 'mc', s: T`At about $72^\circ$ the area factor $1/\cos^2\varphi$ is about 10, so Greenland is shown roughly ten times too large. Africa, on the equator, is barely stretched.` },
      { q: T`What is a conformal projection?`, a: T`One that keeps the shape of small areas (true angles)`, w: [T`One that keeps areas in the right proportion`, T`One that keeps distances from a single point`, T`One drawn on a cone`], only: 'mc', s: T`Conformal (orthomorphic) projections keep local angles and shapes; no projection can keep both shape and area.` },
    ]),
    () => {
      const [kind, desc] = pick([['cylindrical', T`meridians and parallels are straight lines crossing at right angles`], ['conic', T`parallels are arcs of circles and meridians are straight lines that meet at a point`], ['azimuthal', T`parallels are circles and meridians radiate out from the centre`]]);
      const name = { cylindrical: T`Cylindrical`, conic: T`Conic`, azimuthal: T`Azimuthal` }[kind];

    },
  ],
},
{
  id: 'contours', stage: 'sh', title: 'Contours & Relief',
  blurb: 'Reading contour lines, contour interval, spot heights, drawing a cross-section, and calculating gradient and slope from a topographic map.',
  lesson: () => T`
<p>Topographic maps show the height of the land with <b>contour lines</b>: lines joining points of equal height above mean sea level. The height difference between neighbouring contours is the <b>contour interval</b>; every fifth line (the index contour) is usually drawn thicker.</p>
${FigW(contourSvg([[30, 26, 330, 11], [68, 34, 240, 9], [86, 12, 130, 7]], { interval: 50, A: [8, 30], B: [94, 30], label: T`A contour map of two hills with a line A–B and the cross-section along it` }), T`Two hills with a 50 m contour interval, and the cross-section (profile) along A–B.`)}
${Key(T`<p><b>Reading contours.</b> Lines close together mean a steep slope; far apart, a gentle slope. Closed rings with rising values are a hill; contours never cross or split. Where contours form a V, the V points <b>upstream</b> in a valley and <b>downhill</b> along a ridge.</p>`)}
<p>A common rule for the contour interval of a map is</p>
${Fm(T`\text{CI} = \frac{\text{scale denominator}}{2000}\ \text{metres}`)}
<p>so a $1 : 50\,000$ map has contours every $25\,\mathrm{m}$.</p>
<h3>Gradient and slope</h3>
${Fm(T`\text{gradient} = \frac{\text{difference in height}}{\text{horizontal distance}} \qquad \text{slope angle} = \tan^{-1}(\text{gradient})`)}
<p>Both distances must be in the same unit. A rise of $100\,\mathrm{m}$ over $2\,\mathrm{km}$ is $\frac{100}{2000} = \frac{1}{20}$, which is $5\%$ or about $2.9^\circ$.</p>
${Tip(T`<p>Measure the horizontal distance on the map and convert it with the scale first. Only then divide the height difference by it.</p>`)}`,
  gens: [
    () => {
      const h1 = ri(1, 8) * 50, dh = pick([50, 100, 150, 200, 250, 300]), den = pick([25000, 50000]), d = pick([2, 3, 4, 5, 6, 8]), horiz = d * den / 100, g = dh / horiz, ask = pick(['ratio', 'pct', 'deg']);
      const fig = FigW(contourSvg([[62, 30, h1 + dh + 20, 16]], { interval: 50, base: h1 - 30, marks: [[20, 30, `A · ${h1} m`], [62, 30, `B · ${h1 + dh} m`]], profile: false, label: T`A contour map with points A and B` }));
      return ask === 'ratio'
        ? { q: T`On a map with a scale of $1 : ${M(den)}$, point A (${h1} m) and point B (${h1 + dh} m) are ${Q(d, 'cm')} apart. What is the gradient from A to B? Give it as $1 : n$ and type $n$.${fig}`, a: sig(horiz / dh), w: [sig(dh / horiz * 100), sig(horiz / dh / 10), sig(d * den / dh)],
          s: T`Horizontal distance $= ${d} \times ${M(den)}\,\mathrm{cm} = ${M(horiz)}\,\mathrm{m}$. Gradient $= \frac{${dh}}{${M(horiz)}} = 1 : ${M(sig(horiz / dh))}$.` }
        : ask === 'pct'
          ? { q: T`On a map with a scale of $1 : ${M(den)}$, point A (${h1} m) and point B (${h1 + dh} m) are ${Q(d, 'cm')} apart. What is the average slope between them, as a percentage?${fig}`, a: sig(g * 100), u: '%', w: [sig(g), sig(g * 1000), sig(deg(Math.atan(g)))],
            s: T`Horizontal distance $= ${M(horiz)}\,\mathrm{m}$, so the slope is $\frac{${dh}}{${M(horiz)}} \times 100\% = ${M(sig(g * 100))}\%$.` }
          : { q: T`On a map with a scale of $1 : ${M(den)}$, point A (${h1} m) and point B (${h1 + dh} m) are ${Q(d, 'cm')} apart. What is the average slope angle between them, in degrees?${fig}`, a: sig(deg(Math.atan(g))), u: '°', rtol: 0.02, w: [sig(g * 100), sig(deg(Math.atan(g)) * 10), sig(deg(Math.asin(Math.min(1, g * 3))))],
            s: T`Horizontal distance $= ${M(horiz)}\,\mathrm{m}$; gradient $= \frac{${dh}}{${M(horiz)}} = ${M(sig(g))}$; angle $= \tan^{-1}(${M(sig(g))}) = ${QT(sig(deg(Math.atan(g))), '°')}$.` };
    },
    () => {
      const den = pick([10000, 20000, 25000, 50000, 100000, 200000]), ci = den / 2000;
      return { q: T`Using the rule $\text{CI} = \frac{\text{denominator}}{2000}$, what contour interval suits a map with a scale of $1 : ${M(den)}$?`, a: ci, u: 'm', rtol: 0, w: [den / 1000, den / 200, den / 20000], s: T`$\frac{${M(den)}}{2000} = ${QT(ci, 'm')}$.` };
    },
    () => {
      const ci = pick([10, 12.5, 25, 50, 100]), lo = ri(1, 6) * ci, n = ri(3, 9), hi = lo + n * ci;
      return { q: T`A hill has contours from ${Q(lo, 'm')} up to ${Q(hi, 'm')} with an interval of ${Q(ci, 'm')}. How many contour lines are drawn on it (including both of those)?`, a: n + 1, rtol: 0, w: [n, n + 2, hi / ci], s: T`$\frac{${M(hi)} - ${M(lo)}}{${M(ci)}} = ${n}$ intervals, which need $${n} + 1 = ${n + 1}$ lines.` };
    },
    () => pick([
      { q: T`On a contour map the lines are very close together on the east side of a hill and far apart on the west side. What does this mean?`, a: T`The east side is steeper`, w: [T`The west side is steeper`, T`The east side is higher`, T`Both sides have the same slope`], only: 'mc', s: T`The closer the contours, the more height is gained in a short distance: a steeper slope.` },
      { q: T`Contours cross a river in a V shape. Which way does the V point?`, a: T`Upstream, towards higher ground`, w: [T`Downstream, towards the sea`, T`Towards the east`, T`It depends on the scale`], only: 'mc', s: T`A valley cuts back into higher ground, so the V of the contours points upstream.` },

      { q: T`What does a contour line join?`, a: T`Points of equal height above sea level`, w: [T`Points of equal rainfall`, T`Points of equal temperature`, T`Points of equal pressure`], only: 'mc', s: T`Contours (isohypses) join equal heights. Lines of equal rainfall are isohyets, of equal temperature isotherms, of equal pressure isobars.` },

{
  id: 'remote-sensing', stage: 'sh', title: 'Remote Sensing',
  blurb: 'Gathering information about the Earth without touching it: energy, sensors and platforms, spectral signatures, resolution, image interpretation and photo scale.',
  lesson: () => T`
<p><b>Remote sensing</b> is gathering information about an object without touching it, by recording the electromagnetic energy it reflects or emits. Satellites, aircraft and drones carry the sensors.</p>
${FigW(remoteSensingSvg({ sun: T`Sun`, sensor: T`Sensor`, atmosphere: T`Atmosphere`, station: T`Ground station`, label: T`Sunlight passes through the atmosphere, is reflected by the ground and recorded by a satellite sensor, which sends the data to a ground station` }), T`The components: an energy source, the atmosphere, the object, the sensor on its platform, and the receiving station where the data are processed and interpreted.`)}
<p>A <b>passive</b> system records sunlight reflected by the surface (or heat it emits). An <b>active</b> system, such as radar, sends out its own energy, so it can work at night and see through clouds, which is very useful in cloudy Indonesia.</p>
<h3>Spectral signatures</h3>
${FigW(lineChartSvg([
  { pts: [[0.4, 5], [0.5, 9], [0.55, 14], [0.65, 5], [0.72, 22], [0.8, 48], [1.0, 50], [1.3, 42], [1.45, 20], [1.65, 34], [1.9, 12], [2.2, 22], [2.4, 15]], cls: 'g-l3', label: T`Vegetation`, at: 5, dx: 6, dy: -8, anchor: 'start' },
  { pts: [[0.4, 10], [0.6, 18], [0.8, 25], [1.0, 30], [1.3, 33], [1.45, 28], [1.65, 36], [1.9, 26], [2.2, 34], [2.4, 30]], cls: 'g-l4', label: T`Dry soil`, at: 9, dx: -4, dy: -8 },
  { pts: [[0.4, 8], [0.5, 7], [0.6, 4], [0.7, 2], [0.8, 1], [1.0, 0.5], [1.5, 0.3], [2.4, 0.2]], cls: 'g-l1', label: T`Water`, at: 6, dx: 0, dy: -8 }],
  { xMin: 0.4, xMax: 2.4, xStep: 0.4, yMax: 60, yStep: 20, xl: T`wavelength (µm)`, yl: T`reflectance (%)`, label: T`Spectral signatures of vegetation, dry soil and water` }), T`Each surface reflects a different share of each wavelength. Healthy plants reflect strongly in the near infrared, water absorbs almost all of it.`)}
${Tbl([T`Resolution`, T`Meaning`], [[T`Spatial`, T`the size of the smallest object that can be seen (one pixel covers e.g. $30\,\mathrm{m} \times 30\,\mathrm{m}$)`], [T`Spectral`, T`the number and width of the wavelength bands recorded`], [T`Temporal`, T`how often the same place is recorded (e.g. every 16 days)`], [T`Radiometric`, T`how many brightness levels the sensor can distinguish`]])}
${Key(T`<p><b>Elements of image interpretation</b>: tone or colour, size, shape, texture, pattern, shadow, site and association. For example, a large rectangle with a long straight strip beside it (shape and association) suggests an airport.</p>`)}
<p>The scale of a vertical aerial photograph depends on the camera's focal length $f$ and the flying height $H$ above the ground:</p>
${Fm(T`\text{scale} = \frac{f}{H}`)}
${Tip(T`<p>Put $f$ and $H$ in the same unit: a $150\,\mathrm{mm}$ lens at $3000\,\mathrm{m}$ gives $\frac{0.15}{3000} = \frac{1}{20\,000}$.</p>`)}`,
  gens: [
    () => {
      const f = pick([100, 150, 152, 200, 300]), H = pick([1500, 2000, 3000, 4500, 6000]), den = sig(H / (f / 1000));
      return { q: T`An aerial camera with a focal length of ${Q(f, 'mm')} takes vertical photos from ${Q(H, 'm')} above the ground. What is the photo scale? Type the denominator.`, a: den, rtol: 0.005, w: [sig(H / f), sig(den * 10), sig(f * H)], h: T`Type only the denominator, e.g. 20000 for 1 : 20,000.`,
        s: T`$\frac{f}{H} = \frac{${f}\,\mathrm{mm}}{${M(H)}\,\mathrm{m}} = \frac{${M(f / 1000)}\,\mathrm{m}}{${M(H)}\,\mathrm{m}} = 1 : ${M(den)}$.` };
    },
    () => {
      const den = pick([5000, 10000, 20000, 25000, 50000]), cm = pick([1.2, 2, 2.5, 3, 4.5, 6]), m = sig(cm * den / 100);
      return { q: T`On an aerial photograph with a scale of $1 : ${M(den)}$ a runway is ${Q(cm, 'cm')} long. How long is it on the ground?`, a: m, u: 'm', w: [sig(m * 10), sig(m / 10), sig(cm * den)], s: T`$${M(cm)} \times ${M(den)} = ${M(cm * den)}\,\mathrm{cm} = ${QT(m, 'm')}$.` };
    },
    () => {
      const px = pick([10, 15, 20, 30, 60, 250]), km2 = pick([1, 4, 9, 25, 100]), n = sig(km2 * 1e6 / (px * px));
      return { q: T`A satellite image has a spatial resolution of ${Q(px, 'm')} (each pixel covers ${px} m × ${px} m). How many pixels cover an area of ${Q(km2, 'km^2')}?`, a: n, w: [sig(km2 * 1e6 / px), sig(n / 10), sig(n * 10)], rtol: 0.01,
        s: T`One pixel is $${px}^2 = ${M(px * px)}\,\mathrm{m^2}$ and $${km2}\,\mathrm{km^2} = ${M(km2 * 1e6)}\,\mathrm{m^2}$, so there are $\frac{${M(km2 * 1e6)}}{${M(px * px)}} = ${M(n)}$ pixels.` };
    },
    () => pick([
      { q: T`A satellite records the same area every 16 days. Which kind of resolution does this describe?`, a: T`Temporal resolution`, w: [T`Spatial resolution`, T`Spectral resolution`, T`Radiometric resolution`], only: 'mc', s: T`Temporal resolution is how often the same place is imaged.` },
      { q: T`A sensor records 11 separate wavelength bands. Which kind of resolution does this describe?`, a: T`Spectral resolution`, w: [T`Spatial resolution`, T`Temporal resolution`, T`Radiometric resolution`], only: 'mc', s: T`Spectral resolution is the number and width of the bands.` },
      { q: T`On an image, one pixel covers 10 m × 10 m of ground. Which kind of resolution is this?`, a: T`Spatial resolution`, w: [T`Spectral resolution`, T`Temporal resolution`, T`Radiometric resolution`], only: 'mc', s: T`Spatial resolution is the ground size of one pixel: the smallest object that can be seen.` },
      { q: T`Why is radar useful for mapping Indonesia?`, a: T`It sends its own energy, so it works at night and through clouds`, w: [T`It uses sunlight, so it has better colours`, T`It only records heat`, T`It is carried only by aircraft`], only: 'mc', s: T`Radar is an active system with microwaves that pass through clouds, which cover much of Indonesia for much of the year.` },
      { q: T`Which surface reflects most strongly in the near-infrared band?`, a: T`Healthy vegetation`, w: [T`Clear water`, T`Asphalt`, T`Deep shadow`], only: 'mc', s: T`The cell structure of healthy leaves reflects near infrared strongly, which is why vegetation looks bright in infrared images. Water absorbs it.` },
    ]),
    () => {
      const [q, a] = pick([[T`Rice fields are recognised by their regular, square plots arranged side by side.`, T`Pattern`], [T`A football field is recognised by its size and rectangular outline.`, T`Shape`], [T`A forest looks rough and a grass field looks smooth.`, T`Texture`], [T`Water appears dark on the image.`, T`Tone / colour`], [T`A tall chimney is recognised by the long shadow it casts.`, T`Shadow`], [T`A building next to a sports field and a car park is probably a school.`, T`Association`], [T`Mangroves are recognised because they grow along muddy coasts.`, T`Site`]]);
      return { q: T`Which element of image interpretation is used here? <i>${q}</i>`, a, w: [T`Pattern`, T`Shape`, T`Texture`, T`Tone / colour`, T`Shadow`, T`Association`, T`Site`, T`Size`].filter(x => x !== a).sort(() => rng() - 0.5).slice(0, 3), only: 'mc', s: T`The clue is the object's <b>${a}</b>.` };
    },
  ],
},
{
  id: 'gis', stage: 'sh', title: 'Geographic Information Systems',
  blurb: 'What a GIS is, its components, vector and raster data, spatial and attribute data, and analyses such as overlay, buffer and query.',
  lesson: () => T`
<p>A <b>Geographic Information System</b> (GIS) is a computer system for capturing, storing, analysing and displaying data that are tied to locations on the Earth. It turns maps into layers of data that can be combined and questioned.</p>
${Fig(gisLayersSvg([T`Roads`, T`Rivers`, T`Settlements`, T`Land use`, T`Elevation`], { label: T`Five data layers of the same area stacked on top of each other` }), T`A GIS stores each theme as a separate layer over the same area; layers can be switched on, combined and analysed.`)}
<p>Its five components are <b>hardware</b>, <b>software</b>, <b>data</b>, <b>people</b> (users and operators) and <b>methods</b>. The work runs in four stages: data input, data management, analysis and manipulation, and output (maps, tables, reports).</p>
<h3>Two kinds of data</h3>
${Fig(rasterVectorSvg({ raster: T`Raster`, vector: T`Vector`, label: T`The same area stored as raster cells and as vector points, lines and polygons` }), T`Raster data are a grid of cells, each with one value. Vector data are points, lines and polygons defined by coordinates.`)}
${Tbl([T``, T`Vector`, T`Raster`], [[T`Stores`, T`points, lines, polygons`, T`a grid of cells (pixels)`], [T`Good for`, T`boundaries, roads, rivers, wells`, T`continuous surfaces: height, rainfall, satellite images`], [T`Detail`, T`sharp edges, small files`, T`depends on cell size; can be large files`]])}
<p><b>Spatial data</b> say <i>where</i> a feature is (its coordinates); <b>attribute data</b> say <i>what</i> it is (name, population, land use) and are kept in a table linked to the feature.</p>
${Key(T`<p><b>Common analyses.</b> <i>Overlay</i>: combining layers, e.g. flat land that is not forest and not flood-prone. <i>Buffer</i>: a zone of set width around a feature, e.g. 100 m either side of a river. <i>Query</i>: selecting features that meet a condition. <i>Network analysis</i>: the shortest or fastest route along roads.</p>`)}
${Tip(T`<p>The area of a buffer around a single point of radius $r$ is $\pi r^2$; along a straight road of length $L$, a buffer of width $w$ on each side covers about $2wL$.</p>`)}`,
  gens: [
    () => {
      const cell = pick([10, 20, 30, 50, 100]), n = pick([100, 250, 400, 1000, 2500]), ha = sig(n * cell * cell / 1e4);
      return { q: T`In a raster land-use map each cell is ${cell} m × ${cell} m. The forest class covers ${NUM(n)} cells. What area is that, in hectares? ($1\,\mathrm{ha} = 10\,000\,\mathrm{m^2}$.)`, a: ha, u: 'ha', w: [sig(ha * 100), sig(n * cell / 1e4), sig(ha / 100)],
        s: T`One cell is $${cell}^2 = ${M(cell * cell)}\,\mathrm{m^2}$, so the forest covers $${M(n)} \times ${M(cell * cell)} = ${M(n * cell * cell)}\,\mathrm{m^2} = ${QT(ha, 'ha')}$.` };
    },
    () => {
      const r = pick([100, 200, 250, 500, 1000]), A = sig(Math.PI * r * r / 1e4);
      return { q: T`A GIS draws a buffer of radius ${Q(r, 'm')} around a well. What area does the buffer cover, in hectares?`, a: A, u: 'ha', rtol: 0.01, w: [sig(2 * Math.PI * r / 1e4), sig(A * 100), sig(r * r / 1e4)],
        s: T`$A = \pi r^2 = \pi \times ${r}^2 = ${M(sig(Math.PI * r * r))}\,\mathrm{m^2} = ${QT(A, 'ha')}$.` };
    },
    () => {
      const w = pick([25, 50, 100, 200]), L = pick([2, 3, 5, 8, 12]), A = sig(2 * w * L * 1000 / 1e4);
      return { q: T`A buffer of ${Q(w, 'm')} is drawn on each side of a straight road ${Q(L, 'km')} long. Ignoring the rounded ends, what area does it cover, in hectares?`, a: A, u: 'ha', w: [sig(A / 2), sig(A * 10), sig(w * L)],
        s: T`Width $2 \times ${w} = ${2 * w}\,\mathrm{m}$, length $${M(L * 1000)}\,\mathrm{m}$: $${2 * w} \times ${M(L * 1000)} = ${M(2 * w * L * 1000)}\,\mathrm{m^2} = ${QT(A, 'ha')}$.` };
    },
    () => pick([
      { q: T`A planner wants land that is flat, not forest and outside the flood zone. Which GIS analysis combines these layers?`, a: T`Overlay`, w: [T`Buffer`, T`Network analysis`, T`Digitising`], only: 'mc', s: T`Overlay combines several layers to find places that meet all the conditions at once.` },
      { q: T`Building is banned within 100 m of a river. Which GIS analysis marks this zone?`, a: T`Buffer`, w: [T`Overlay`, T`Query`, T`Interpolation`], only: 'mc', s: T`A buffer draws a zone of fixed distance around a feature.` },
      { q: T`An ambulance needs the fastest route to a hospital. Which GIS analysis is used?`, a: T`Network analysis`, w: [T`Buffer`, T`Overlay`, T`Classification`], only: 'mc', s: T`Network analysis finds shortest or fastest routes along a road network.` },
      { q: T`Which data model is best for a digital elevation model covering a whole province?`, a: T`Raster`, w: [T`Vector points only`, T`Vector lines`, T`Attribute table only`], only: 'mc', s: T`Height changes continuously, so a grid of cells (raster) suits it.` },
      { q: T`In a GIS, how is a river usually stored as vector data?`, a: T`As a line`, w: [T`As a point`, T`As a polygon`, T`As a raster cell`], only: 'mc', s: T`Rivers and roads are lines; wells and towns on a small-scale map are points; lakes and districts are polygons.` },
      { q: T`Which of these is attribute data?`, a: T`The population of each village`, w: [T`The coordinates of each village`, T`The outline of each district`, T`The route of a river`], only: 'mc', s: T`Attribute data describe what a feature is; coordinates and outlines are spatial data.` },
      { q: T`Which is <b>not</b> one of the five components of a GIS?`, a: T`A printed atlas`, w: [T`Hardware`, T`Software`, T`People`], only: 'mc', s: T`The components are hardware, software, data, people and methods.` },
    ]),
  ],
},
  ],

level({
  id: 'lithosphere', mark: 'B', name: 'The Lithosphere', short: 'Lithosphere', band: 'Plates · rocks · landforms', color: 'lv2',
  blurb: 'The solid Earth: its layers, moving plates, rocks, volcanoes and earthquakes, and the landforms and soils that shape the surface.',
  topics: [
{
  id: 'earth-structure', stage: 'sh', title: 'Structure of the Earth',
  blurb: 'The crust, mantle and core, how seismic waves reveal them, the lithosphere and asthenosphere, and the heat inside the Earth.',
  lesson: () => T`
<p>Nobody has drilled deeper than about $12\,\mathrm{km}$, yet we know the inside of the Earth well. Earthquake waves speed up, slow down and bend as they pass through layers of different density, and <b>S waves cannot pass through liquids</b>, which shows that the outer core is molten.</p>
${FigW(earthLayersSvg({ names: [T`Crust`, T`Mantle`, T`Outer core`, T`Inner core`], label: T`A cutaway of the Earth showing the crust, mantle, outer core and inner core with their depths` }), T`The Earth's layers. The radius is about 6 371 km.`)}
${Tbl([T`Layer`, T`Depth`, T`State and make-up`], [[T`Crust`, T`0 to 5–70 km`, T`solid rock; thin oceanic crust (basalt, "SIMA") and thicker continental crust (granite, "SIAL")`], [T`Mantle`, T`to 2 900 km`, T`hot silicate rock; solid, but it flows slowly over millions of years`], [T`Outer core`, T`2 900–5 150 km`, T`liquid iron and nickel; its currents make the Earth's magnetic field`], [T`Inner core`, T`5 150–6 371 km`, T`solid iron and nickel, about 5 000 °C, solid because of the huge pressure`]])}
<p>The boundaries between layers are called <b>discontinuities</b>: the <b>Mohorovičić</b> (Moho) between crust and mantle, the <b>Gutenberg</b> between mantle and core, and the <b>Lehmann</b> between outer and inner core.</p>
${Key(T`<p>For plate tectonics what matters is stiffness, not composition. The <b>lithosphere</b> (the crust plus the rigid top of the mantle, about 100 km thick) is broken into plates that ride on the <b>asthenosphere</b>, a hot, weak layer of the upper mantle that can flow.</p>`)}
<p>Temperature rises with depth. In the crust the <b>geothermal gradient</b> is typically about $25$–$30\,^\circ\mathrm{C}$ per kilometre, which is why deep mines are hot and why geothermal energy can be tapped.</p>
${Tip(T`<p>Do not confuse the lithosphere (rigid, includes the crust) with the crust itself: the crust is only the top part of the lithosphere.</p>`)}`,
  gens: [
    () => {
      const t0 = pick([25, 27, 28, 30]), g = pick([25, 30]), d = pick([1, 1.5, 2, 2.5, 3, 4]), T1 = t0 + g * d;
      return { q: T`The rock temperature at the surface is ${Q(t0, '°C')} and the geothermal gradient is ${Q(g, '°C')} per km. What is the temperature at the bottom of a mine ${Q(d, 'km')} deep?`, a: sig(T1), u: '°C', w: [sig(g * d), sig(t0 + g / d), sig(t0 + g * d * 10)],
        s: T`$T = ${t0} + ${g} \times ${M(d)} = ${QT(sig(T1), '°C')}$.` };
    },
    () => {
      const t0 = pick([26, 28, 30]), T1 = pick([100, 150, 200, 250]), g = pick([25, 30]), d = sig((T1 - t0) / g);
      return { q: T`Water must reach ${Q(T1, '°C')} for a geothermal power plant. With a surface temperature of ${Q(t0, '°C')} and a gradient of ${Q(g, '°C')} per km, how deep must the well go?`, a: d, u: 'km', w: [sig(T1 / g), sig((T1 + t0) / g), sig(d * 10)],
        s: T`$d = \frac{${T1} - ${t0}}{${g}} = ${QT(d, 'km')}$.` };
    },
    () => pick([
      { q: T`How do we know that the outer core is liquid?`, a: T`S waves from earthquakes do not pass through it`, w: [T`Drill cores have reached it`, T`Volcanoes erupt liquid iron`, T`P waves travel faster in it`], only: 'mc', s: T`S waves (shear waves) cannot travel through liquids. They are missing on the far side of the Earth from an earthquake, so the outer core must be liquid.` },
      { q: T`What is the name of the boundary between the crust and the mantle?`, a: T`Mohorovičić discontinuity (Moho)`, w: [T`Gutenberg discontinuity`, T`Lehmann discontinuity`, T`The asthenosphere`], only: 'mc', s: T`The Moho is where seismic waves suddenly speed up at the top of the mantle.` },
      { q: T`What is the lithosphere?`, a: T`The crust together with the rigid uppermost mantle`, w: [T`The crust only`, T`The liquid outer core`, T`The weak layer the plates move on`], only: 'mc', s: T`The lithosphere is the rigid outer shell, about 100 km thick, broken into plates. The weak layer beneath is the asthenosphere.` },
      { q: T`Which layer of the Earth is solid even though it is the hottest?`, a: T`The inner core`, w: [T`The outer core`, T`The asthenosphere`, T`The crust`], only: 'mc', s: T`The inner core is about 5 000 °C, but the enormous pressure keeps the iron solid.` },
      { q: T`Which kind of crust is thinner and made mainly of basalt?`, a: T`Oceanic crust`, w: [T`Continental crust`, T`Both are the same`, T`The mantle crust`], only: 'mc', s: T`Oceanic crust is 5–10 km thick and basaltic (SIMA); continental crust is 30–70 km thick and mainly granitic (SIAL).` },
      { q: T`Which discontinuity separates the mantle from the core, at about 2 900 km?`, a: T`Gutenberg discontinuity`, w: [T`Mohorovičić discontinuity`, T`Lehmann discontinuity`, T`Conrad discontinuity`], only: 'mc', s: T`The Gutenberg discontinuity marks the core–mantle boundary; S waves stop there.` },
    ]),
    () => {
      const [layer, a, b] = pick([[T`the mantle`, 35, 2900], [T`the outer core`, 2900, 5150], [T`the inner core`, 5150, 6371]]), th = b - a, pct = sig(th / 6371 * 100);
      return { q: T`${layer === T`the mantle` ? T`The mantle reaches from about 35 km to 2 900 km deep.` : layer === T`the outer core` ? T`The outer core reaches from about 2 900 km to 5 150 km deep.` : T`The inner core reaches from about 5 150 km to the centre at 6 371 km.`} What percentage of the Earth's radius (6 371 km) is its thickness?`, a: pct, u: '%', rtol: 0.02, w: [sig(b / 6371 * 100), sig(a / 6371 * 100) || sig(pct / 2), sig(th / 12742 * 100)],
        s: T`Thickness $= ${M(b)} - ${M(a)} = ${M(th)}\,\mathrm{km}$, and $\frac{${M(th)}}{6371} \times 100\% = ${M(pct)}\%$.` };
    },
  ],
},
{
  id: 'plate-tectonics', stage: 'sh', title: 'Plate Tectonics',
  blurb: 'Continental drift and sea-floor spreading, the three kinds of plate boundary, and why Indonesia has so many volcanoes and earthquakes.',
  lesson: () => T`
<p>In 1912 <b>Alfred Wegener</b> proposed that the continents had once formed one supercontinent, <b>Pangaea</b>, and had drifted apart. His evidence: the coasts of South America and Africa fit like a jigsaw; the same fossils (such as <i>Mesosaurus</i> and <i>Glossopteris</i>) and rock types are found on continents now oceans apart; and traces of ancient glaciers appear in places that are now tropical. In the 1960s <b>sea-floor spreading</b> explained the mechanism: new crust forms at mid-ocean ridges and old crust sinks back at trenches, driven by convection in the mantle.</p>
${Key(T`<p>The lithosphere is broken into about a dozen large <b>plates</b> moving a few centimetres a year, about as fast as fingernails grow. Almost all earthquakes and volcanoes happen along their boundaries.</p>`)}
${Fig(plateBoundarySvg('divergent', { names: { ridge: T`Mid-ocean ridge`, plate: T`Oceanic plate`, magma: T`Rising magma` }, label: T`A divergent boundary: plates move apart at a mid-ocean ridge where magma rises` }), T`<b>Divergent</b>: plates move apart and new crust forms, e.g. the Mid-Atlantic Ridge and the East African Rift.`)}
${Fig(plateBoundarySvg('subduction', { names: { trench: T`Trench`, volcano: T`Volcanic arc`, ocean: T`Oceanic plate`, cont: T`Continental plate`, sub: T`Subduction zone` }, label: T`A convergent boundary: an oceanic plate sinks beneath a continental plate, forming a trench and a line of volcanoes` }), T`<b>Convergent (subduction)</b>: the denser oceanic plate sinks under the other, forming a deep trench, earthquakes and a chain of volcanoes, e.g. the Java Trench and the volcanoes of Sumatra and Java.`)}
${Fig(plateBoundarySvg('collision', { names: { mountains: T`Fold mountains`, cont: T`Continental plate` }, label: T`Two continental plates collide and crumple into fold mountains` }), T`<b>Convergent (collision)</b>: two continents collide and crumple up into fold mountains, e.g. the Himalayas.`)}
${Fig(plateBoundarySvg('transform', { names: { fault: T`Transform fault`, offset: T`offset river` }, label: T`Seen from above, two plates slide past each other along a transform fault, offsetting a river` }), T`<b>Transform</b>: plates slide past each other, causing earthquakes but no volcanoes, e.g. the San Andreas Fault.`)}
<h3>Indonesia: where three plates meet</h3>
${FigW(platesIndonesiaSvg({ names: { eu: T`Eurasian Plate`, ia: T`Indo-Australian Plate`, pa: T`Pacific Plate`, trench: T`Java Trench` }, label: T`Map of Indonesia with plate boundaries and the chain of volcanoes` }), T`The Indo-Australian Plate moves north under the Eurasian Plate along the Sunda (Java) Trench, and the Pacific Plate pushes in from the east. Triangles mark some of the active volcanoes.`)}
${Tip(T`<p>This position makes Indonesia part of the Pacific <b>Ring of Fire</b>: it has about 127 active volcanoes and frequent earthquakes, but also fertile volcanic soils, geothermal energy and rich mineral deposits.</p>`)}`,
  gens: [
    () => {
      const r = pick([2, 3, 4, 5, 6, 7, 8]), yrs = pick([1e5, 5e5, 1e6, 2e6, 1e7]), km = sig(r * yrs / 1e5);
      return { q: T`A plate moves at ${Q(r, 'cm')} per year. How far does it move in ${NUM(yrs)} years, in kilometres?`, a: km, u: 'km', w: [sig(km * 10), sig(km / 10), sig(r * yrs / 1e3)],
        s: T`$${r} \times ${M(yrs)} = ${M(r * yrs)}\,\mathrm{cm} = ${QT(km, 'km')}$ (divide by 100 000 to change cm into km).` };
    },
    () => {
      const r = pick([2, 2.5, 4, 5]), km = pick([100, 250, 500, 1000, 1500]), my = sig(km * 1e5 / r / 1e6);
      return { q: T`Rock on the sea floor is found ${Q(km, 'km')} from a mid-ocean ridge. The plate moves away from the ridge at ${Q(r, 'cm')} per year. About how old is the rock, in millions of years?`, a: my, u: T`million years`, w: [sig(my * 10), sig(my / 10), sig(my * 2)],

  lesson: () => T`
<p>A <b>mineral</b> is a naturally occurring solid with a definite chemical composition and crystal structure, such as quartz or feldspar. A <b>rock</b> is a mixture of one or more minerals. Minerals are identified by their colour, streak, lustre, cleavage and <b>hardness</b>, measured on Mohs' scale from 1 (talc) to 10 (diamond): a harder mineral scratches a softer one.</p>
${Tbl([T`Rock type`, T`How it forms`, T`Examples`], [
  [T`Igneous`, T`magma or lava cools and crystallises; slow cooling underground gives large crystals (intrusive), fast cooling at the surface gives small crystals or glass (extrusive)`, T`granite, diorite, gabbro (intrusive); basalt, andesite, obsidian, pumice (extrusive)`],
  [T`Sedimentary`, T`fragments, shells or dissolved minerals are deposited in layers, then compacted and cemented`, T`sandstone, conglomerate, shale, limestone, coal, rock salt`],
  [T`Metamorphic`, T`an existing rock is changed by heat and pressure without melting`, T`marble (from limestone), slate (from shale), quartzite (from sandstone), gneiss (from granite)`]])}
${FigW(cycleSvg([T`Magma`, T`Igneous rock`, T`Sediment`, T`Sedimentary rock`, T`Metamorphic rock`], { center: T`Rock cycle`, label: T`The rock cycle: magma cools into igneous rock, which weathers into sediment, which becomes sedimentary rock, then metamorphic rock, which can melt back into magma` }), T`The rock cycle. Any rock can also be uplifted and weathered, or buried and melted, so there are many shortcuts.`)}
${Key(T`<p><b>Processes in the rock cycle.</b> Cooling and crystallisation turn magma into igneous rock. Weathering, erosion and deposition turn any rock into sediment. Compaction and cementation (lithification) turn sediment into sedimentary rock. Heat and pressure make metamorphic rock. Melting turns rock back into magma.</p>`)}
${Tip(T`<p>Indonesia is rich in andesite and basalt from its volcanoes, limestone from ancient coral reefs (e.g. Gunung Kidul and the Maros karst), and coal in Kalimantan and Sumatra.</p>`)}`,
  gens: [
    () => {
      const [rock, a] = pick([[T`granite`, T`Igneous (intrusive)`], [T`basalt`, T`Igneous (extrusive)`], [T`pumice`, T`Igneous (extrusive)`], [T`obsidian`, T`Igneous (extrusive)`], [T`andesite`, T`Igneous (extrusive)`], [T`gabbro`, T`Igneous (intrusive)`], [T`sandstone`, T`Sedimentary`], [T`limestone`, T`Sedimentary`], [T`shale`, T`Sedimentary`], [T`conglomerate`, T`Sedimentary`], [T`coal`, T`Sedimentary`], [T`marble`, T`Metamorphic`], [T`slate`, T`Metamorphic`], [T`gneiss`, T`Metamorphic`], [T`quartzite`, T`Metamorphic`]]);

      const minerals = [[T`talc`, 1], [T`gypsum`, 2], [T`calcite`, 3], [T`fluorite`, 4], [T`apatite`, 5], [T`orthoclase feldspar`, 6], [T`quartz`, 7], [T`topaz`, 8], [T`corundum`, 9], [T`diamond`, 10]];

{
  id: 'volcanism', stage: 'sh', title: 'Volcanism',
  blurb: 'Magma and how it reaches the surface, intrusions, types of volcano and eruption, volcanic hazards and benefits, and Indonesia’s alert levels.',
  lesson: () => T`
<p><b>Volcanism</b> covers every way that magma, molten rock from inside the Earth, moves upwards. Magma that cools underground forms <b>intrusions</b>: huge <b>batholiths</b>, lens-shaped <b>laccoliths</b>, flat <b>sills</b> between layers and vertical <b>dikes</b> cutting across them. Magma that reaches the surface erupts as <b>lava</b>.</p>
${FigW(volcanoSvg('strato', { names: { chamber: T`Magma chamber`, vent: T`Vent`, crater: T`Crater`, layers: T`Layers of lava and ash` }, label: T`Cross-section of a stratovolcano with its magma chamber, vent, crater and alternating layers` }), T`A stratovolcano, like Merapi or Semeru, is built of alternating layers of lava and ash.`)}
${Tbl([T`Type`, T`Shape and eruption`, T`Example`], [[T`Stratovolcano (composite)`, T`steep cone of lava and ash layers; sticky magma, explosive eruptions`, T`Merapi, Semeru, Fuji`], [T`Shield volcano`, T`broad, gentle slopes; runny basalt lava flows far`, T`Mauna Loa (Hawaii)`], [T`Cinder cone`, T`small, steep cone of loose fragments`, T`Anak Krakatau in its early years`], [T`Caldera`, T`a huge basin left when a volcano collapses after emptying its magma chamber`, T`Toba, Tengger (Bromo)`]])}
${Key(T`<p><b>Explosive or effusive?</b> Sticky, gas-rich, silica-rich magma (andesite, rhyolite) traps gas and explodes; runny, silica-poor basalt lets gas escape and flows quietly. The <b>Volcanic Explosivity Index</b> (VEI) runs from 0 to 8, and each step means about ten times more erupted material. Tambora (1815) was VEI 7.</p>`)}
<h3>Hazards and benefits</h3>
<p>Dangers include <b>pyroclastic flows</b> (glowing avalanches of hot gas and ash, "wedhus gembel"), <b>lahars</b> (volcanic mudflows, often after heavy rain), ash fall, lava flows, toxic gases and tsunamis. Benefits include fertile soils, geothermal energy, building sand and stone, minerals and tourism.</p>
${Tip(T`<p>Indonesia's volcano alert levels, from low to high: <b>Normal</b> (level I), <b>Waspada</b> (II, watch), <b>Siaga</b> (III, alert) and <b>Awas</b> (IV, warning: evacuate the danger zone).</p>`)}`,
  gens: [
    () => {
      const a = ri(2, 5), b = a + ri(1, 3), f = 10 ** (b - a);
      return { q: T`Each step on the Volcanic Explosivity Index means about ten times more erupted material. About how many times more material does a VEI ${b} eruption produce than a VEI ${a} eruption?`, a: f, rtol: 0, w: [b - a, 10 * (b - a), 2 ** (b - a)].filter(x => x !== f), s: T`$10^{${b} - ${a}} = 10^{${b - a}} = ${M(f)}$ times.` };

        s: T`$${v}\,\mathrm{m/s} = ${M(v * 3.6)}\,\mathrm{km/h}$, so $t = \frac{${d}}{${M(v * 3.6)}} = ${QT(h, 'h')}$.` };
    },
    () => {
      const [k, a] = pick([['strato', T`Stratovolcano`], ['shield', T`Shield volcano`], ['cinder', T`Cinder cone`], ['caldera', T`Caldera`]]);
      return { q: T`Which type of volcano is shown?${Fig(volcanoSvg(k, { names: { chamber: T`Magma chamber`, vent: T`Vent`, crater: ' ', layers: ' ' }, label: T`A volcano in cross-section` }))}`, a, w: [T`Stratovolcano`, T`Shield volcano`, T`Cinder cone`, T`Caldera`].filter(x => x !== a), only: 'mc',
        s: T`A steep layered cone is a stratovolcano; a broad gentle dome a shield volcano; a small steep heap a cinder cone; a wide collapsed basin a caldera. This is a <b>${a}</b>.` };
    },
    () => {
      const [d, a] = pick([[T`a glowing avalanche of hot gas, ash and rock that rushes down the slope`, T`Pyroclastic flow`], [T`a fast mudflow of volcanic ash and water, often after heavy rain`, T`Lahar`], [T`magma that has reached the surface and flows as molten rock`, T`Lava`], [T`fine volcanic particles that settle over a wide area`, T`Ash fall`], [T`a flat sheet of magma that cooled between rock layers`, T`Sill`], [T`a vertical sheet of magma that cut across rock layers`, T`Dike`], [T`a huge mass of magma that cooled deep underground`, T`Batholith`]]);

      { q: T`Why do stratovolcanoes such as Merapi erupt explosively?`, a: T`Their magma is sticky and traps gas`, w: [T`Their magma is very runny`, T`They are below sea level`, T`They have no magma chamber`], only: 'mc', s: T`Silica-rich magma is viscous: gas cannot escape easily, pressure builds up and is released violently.` },
      { q: T`Which is a benefit of living near a volcano?`, a: T`Fertile soil from weathered volcanic ash`, w: [T`Clean air during eruptions`, T`No earthquakes`, T`Protection from floods`], only: 'mc', s: T`Volcanic ash weathers into fertile soils, which is why the slopes of Javanese volcanoes are densely farmed. Geothermal energy and tourism are other benefits.` },

{
  id: 'earthquakes', stage: 'sh', title: 'Earthquakes',
  blurb: 'Causes of earthquakes, focus and epicentre, P, S and surface waves, locating an epicentre, magnitude and intensity, and tsunamis.',
  lesson: () => T`
<p>An <b>earthquake</b> is a sudden shaking of the ground when stress built up in rocks is released, usually as rock slips along a <b>fault</b>. Most are <b>tectonic</b> (at plate boundaries); others are <b>volcanic</b> or caused by collapse, for example of caves or mines. The point underground where the rupture starts is the <b>focus</b> (hypocentre); the point on the surface directly above it is the <b>epicentre</b>.</p>
${Tbl([T`Wave`, T`Motion`, T`Speed in the crust`, T`Travels through`], [[T`P (primary)`, T`push–pull, like a spring`, T`about 6 km/s, arrives first`, T`solids, liquids and gases`], [T`S (secondary)`, T`side to side (shear)`, T`about 3.5 km/s`, T`solids only`], [T`Surface waves`, T`rolling and swaying at the surface`, T`slowest`, T`the surface; they do the most damage`]])}
${FigW(seismogramSvg(40, { names: { p: T`P`, s: T`S` }, label: T`A seismogram showing the P wave arriving first and the S wave 40 seconds later` }), T`A seismogram. The longer the gap between the P and S arrivals, the further away the earthquake.`)}
${Key(T`<p><b>Distance to the epicentre.</b> Both waves start together but P waves are faster. With $v_P = 6\,\mathrm{km/s}$ and $v_S = 3.5\,\mathrm{km/s}$:</p><p>$$d = \frac{t_S - t_P}{\frac{1}{v_S} - \frac{1}{v_P}} \approx 8.4 \times (t_S - t_P)\ \mathrm{km}$$</p><p>with the time gap in seconds. For distant earthquakes Laska's rule is used: $\Delta = \big((S - P) - 1\big) \times 1000\,\mathrm{km}$, with $S - P$ in minutes. Three stations, each with its own distance circle, pinpoint the epicentre where the circles meet.</p>`)}
${Fig(triangulationSvg({ names: { st: T`Station`, epi: T`Epicentre` }, label: T`Three seismic stations with circles showing their distance to the earthquake; the circles meet at the epicentre` }), T`Locating the epicentre by triangulation.`)}
<h3>Magnitude and intensity</h3>
<p><b>Magnitude</b> (Richter or moment magnitude) measures the energy released and is the same everywhere. Each step up means about 10 times bigger ground motion and about 32 times more energy. <b>Intensity</b> (the Modified Mercalli scale, I–XII) describes the shaking and damage at a particular place, so it is higher near the epicentre.</p>
${Tip(T`<p>A shallow earthquake under the sea at a subduction zone can lift the sea floor and start a <b>tsunami</b>. In deep water it travels at $v = \sqrt{g h}$, as fast as a jet plane, and slows and grows taller as it reaches the coast. The 2004 Aceh tsunami followed a magnitude 9.1 earthquake.</p>`)}`,
  gens: [
    () => {
      const dt = pick([10, 15, 20, 25, 30, 40, 50, 60]), d = sig(dt / (1 / 3.5 - 1 / 6));
      return { q: T`A seismograph records the P wave of an earthquake and, ${dt} seconds later, the S wave. How far away is the epicentre? (Take $v_P = 6\,\mathrm{km/s}$ and $v_S = 3.5\,\mathrm{km/s}$.)${FigW(seismogramSvg(dt, { names: { p: T`P`, s: T`S` }, label: T`A seismogram with the P and S arrivals marked` }))}`, a: d, u: 'km', rtol: 0.02, w: [sig(dt * 6), sig(dt * 3.5), sig(dt * 2.5)],
        s: T`$d = \frac{${dt}}{\frac{1}{3.5} - \frac{1}{6}} = \frac{${dt}}{${M(sig(1 / 3.5 - 1 / 6, 3))}} = ${QT(d, 'km')}$.` };
    },
    () => {
      const mn = pick([2, 3, 3.5, 4, 5, 6.5, 8]), d = (mn - 1) * 1000;
      return { q: T`At a distant station the S wave arrives ${NUM(mn)} minutes after the P wave. Using Laska's rule, how far away is the epicentre?`, a: d, u: 'km', rtol: 0, w: [mn * 1000, (mn + 1) * 1000, sig(mn * 60 * 8.4)], s: T`$\Delta = (${M(mn)} - 1) \times 1000 = ${QT(d, 'km')}$.` };
    },
    () => {
      const a = pick([4, 5, 5.5, 6, 6.5]), b = a + pick([1, 2, 3]), en = chance(), dm = b - a, f = en ? sig(31.6 ** dm, 2) : 10 ** dm;
      return { q: T`Compare an earthquake of magnitude ${NUM(b)} with one of magnitude ${NUM(a)}. About how many times ${en ? T`more energy does the larger one release` : T`larger is its ground motion (the amplitude on the seismogram)`}?`, a: f, rtol: en ? 0.05 : 0, w: en ? [10 ** dm, dm * 32, sig(f * 10, 2)] : [sig(31.6 ** dm, 2), dm * 10, dm], s: en ? T`Each unit of magnitude is about 32 times more energy: $32^{${dm}} \approx ${M(f)}$.` : T`Each unit of magnitude is 10 times the amplitude: $10^{${dm}} = ${M(f)}$.` };
    },
    () => {
      const h = pick([1000, 2000, 3000, 4000, 5000]), g = 9.8, v = Math.sqrt(g * h), d = pick([200, 300, 500, 800, 1000]), t = sig(d * 1000 / v / 60);
      return { q: T`A tsunami crosses an ocean ${Q(h, 'm')} deep. It travels at $v = \sqrt{g h}$ with $g = 9.8\,\mathrm{m/s^2}$. How many minutes does it take to reach a coast ${Q(d, 'km')} away?`, a: t, u: 'min', rtol: 0.02, w: [sig(d * 1000 / (g * h) / 60), sig(t * 60), sig(d / v)],
        s: T`$v = \sqrt{9.8 \times ${M(h)}} = ${M(sig(v))}\,\mathrm{m/s}$, so $t = \frac{${M(d * 1000)}}{${M(sig(v))}} = ${M(sig(d * 1000 / v))}\,\mathrm{s} = ${QT(t, 'min')}$.` };
    },
    () => pick([
      { q: T`Which seismic waves arrive first at a seismograph station?`, a: T`P waves`, w: [T`S waves`, T`Surface waves`, T`They all arrive together`], only: 'mc', s: T`P waves are the fastest (about 6 km/s in the crust), so they arrive first.` },
      { q: T`What is the epicentre of an earthquake?`, a: T`The point on the surface directly above the focus`, w: [T`The point underground where the rock breaks`, T`The place with the most damage`, T`The seismograph station nearest to it`], only: 'mc', s: T`The focus (hypocentre) is underground; the epicentre is the point on the surface straight above it.` },
      { q: T`Which scale describes the damage and shaking felt at a particular place?`, a: T`The Modified Mercalli intensity scale`, w: [T`The Richter magnitude scale`, T`The Volcanic Explosivity Index`, T`Mohs' scale`], only: 'mc', s: T`Intensity (I–XII) describes effects at a place; magnitude measures the energy released at the source.` },
      { q: T`Which waves usually cause the most damage to buildings?`, a: T`Surface waves`, w: [T`P waves`, T`S waves`, T`Radio waves`], only: 'mc', s: T`Surface waves arrive last but have the largest ground motion, shaking and rolling buildings.` },
      { q: T`What is the most common cause of earthquakes in Indonesia?`, a: T`Movement of tectonic plates`, w: [T`Collapse of caves`, T`Meteorite impacts`, T`Changes in the weather`], only: 'mc', s: T`Most Indonesian earthquakes are tectonic, from the subduction of the Indo-Australian Plate and from active faults on land.` },
      { q: T`What should you do first when an earthquake starts while you are indoors?`, a: T`Drop, cover under a sturdy table and hold on`, w: [T`Run outside straight away down the stairs`, T`Stand next to a window`, T`Use the lift to leave the building`], only: 'mc', s: T`Drop, cover and hold on protects you from falling objects. Leave only when the shaking stops, never by lift.` },
    ]),
  ],
},
{
  id: 'weathering', stage: 'sh', title: 'Weathering, Mass Movement & Erosion',
  blurb: 'Physical, chemical and biological weathering, landslides and other mass movements, erosion by water, wind, waves and ice, and soil loss.',
  lesson: () => T`
<p>Forces from inside the Earth (<b>endogenic</b>) build up the land; forces at the surface (<b>exogenic</b>) wear it down. The exogenic processes are weathering, mass movement, erosion and deposition.</p>

${Key(T`<p>In hot, wet climates such as Indonesia's, <b>chemical weathering</b> dominates: it is fastest where it is warm and there is plenty of water. That is why tropical soils are deep and red, and why limestone dissolves into caves and karst.</p>`)}
<h3>Mass movement</h3>
<p><b>Mass movement</b> is the movement of weathered material down a slope under gravity: <b>rockfalls</b>, <b>landslides</b> (a mass sliding on a slip surface), <b>mudflows</b> and slow <b>soil creep</b> (shown by tilted trees and fences). It is most likely on steep slopes, after heavy rain, where vegetation has been cleared and where earthquakes shake the ground.</p>
<h3>Erosion and deposition</h3>
<p><b>Erosion</b> is the removal and transport of material by running water, wind, waves and glaciers. When the agent slows down it drops its load: <b>deposition</b>. Soil erosion by rain on bare, sloping farmland is a serious problem; it is reduced by terracing, contour ploughing, cover crops and reforestation.</p>
${Tip(T`<p>Soil loss is often given as a mass per area, such as tonnes per hectare per year. To turn it into a depth, divide by the soil's density and the area: $\text{depth} = \frac{\text{mass}}{\rho \times A}$.</p>`)}`,

<p><b>Soil</b> is the loose top layer of the land, a mixture of mineral particles, organic matter (humus), water and air, in which plants grow. It forms very slowly, often a centimetre in a hundred years or more, so it is easily lost and hard to replace.</p>

<h3>Texture</h3>

<p>The <b>atmosphere</b> is the layer of gases held around the Earth by gravity. It gives us oxygen to breathe, keeps the planet warm, shields us from ultraviolet rays and meteors, and is where all weather happens. Half of its mass lies below about 5.5 km, and 99% below about 30 km.</p>
${Fig(donutSvg([{ label: T`Nitrogen (N₂)`, value: 78.08, show: '78%', cls: 'g-s1' }, { label: T`Oxygen (O₂)`, value: 20.95, show: '21%', cls: 'g-s3' }, { label: T`Argon (Ar)`, value: 0.93, show: NUM(0.93) + '%', cls: 'g-s4' }, { label: T`CO₂ and others`, value: 0.04, show: NUM(0.04) + '%', cls: 'g-s2' }], { center: T`dry air`, label: T`A donut chart of the gases in dry air: 78 percent nitrogen, 21 percent oxygen, 0.93 percent argon and 0.04 percent carbon dioxide and others` }), T`The gases of dry air, by volume. Water vapour (0–4%) comes on top of this and varies from place to place.`)}

<p>The layers are defined by how <b>temperature changes with height</b>. The boundaries between them are called the tropopause, stratopause and mesopause.</p>
${FigW(atmosphereSvg({ names: { tropo: T`Troposphere`, strato: T`Stratosphere`, meso: T`Mesosphere`, thermo: T`Thermosphere`, ozone: T`ozone layer`, temp: T`temperature` }, label: T`The layers of the atmosphere from the ground to 110 km with the temperature curve: it falls in the troposphere, rises in the stratosphere, falls in the mesosphere and rises again in the thermosphere` }), T`Temperature falls, rises, falls and rises again with height. Each change of direction marks the top of a layer.`)}

      return { q: T`Air pressure at sea level is about ${Q(1013, 'hPa')} and it roughly halves for every 5.5 km of height. What is the pressure about ${Q(h, 'km')} up?`, a: p, u: 'hPa', rtol: 0.02, w: [sig(1013 - 100 * h, 3) > 0 ? sig(1013 - 100 * h, 3) : sig(p * 3, 3), sig(1013 / (2 * k), 3) === p ? sig(p / 2, 3) : sig(1013 / (2 * k), 3), sig(p * 2, 3)],
        s: T`${k === 1 ? T`One halving` : T`${k} halvings`}: $1013 \div ${M(2 ** k)} = ${QT(p, 'hPa')}$.` };
    },
    () => {
